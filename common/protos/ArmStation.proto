#VRML_SIM R2025a utf8
# ArmStation — the STATIONARY 4-DOF manipulator with a magnetic gripper and a wrist camera
# (RGB + depth). It stands on the map next to its task (sorting / key) and is driven REMOTELY
# from the participant's controller over a radio link: commands in on channel 71, telemetry and
# camera frames out on channel 72 (see go2_api's `arm` client and common/locomotion/arm_driver_core).
# The `controller` runs the FIXED driver (arm_driver) — participants never edit it.
#
# Arm frame (used by all arm.* coordinates): origin at the pedestal centre ON THE FLOOR,
# axes aligned with the station (not rotated in the competition worlds): x/y horizontal, z up.
# Shoulder sits at (0, 0, 0.61); links L1=0.30, L2=0.28, wrist->tip 0.12; reach ≈ 0.55 m.
PROTO ArmStation [
  field SFVec3f    translation 0 0 0
  field SFRotation rotation    0 0 1 0
  field SFString   name           "arm_station"
  field SFString   controller     "arm_driver"
  field MFString   controllerArgs []
]
{
  Robot {
    translation IS translation
    rotation IS rotation
    name IS name
    controller IS controller
    controllerArgs IS controllerArgs
    supervisor TRUE
    children [
      # radio link to the dog's controller
      Receiver {
        name "cmd_rx"
        channel 71
      }
      Emitter {
        name "tel_tx"
        channel 72
      }
      # pedestal (sits on the floor; tall so the shoulder is ABOVE the objects for a clean top-grasp)
      Pose {
        translation 0 0 0.275
        children [ Shape { appearance DEF ARM_DARK PBRAppearance { baseColor 0.16 0.16 0.18 roughness 0.4 metalness 0.6 } geometry Cylinder { radius 0.09 height 0.55 } } ]
      }
      Pose {
        translation 0 0 0.56
        children [ Shape { appearance PBRAppearance { baseColor 0.89 0.04 0.07 roughness 0.4 metalness 0.2 } geometry Cylinder { radius 0.095 height 0.02 } } ]
      }
      # ── the arm: base yaw → shoulder pitch → elbow pitch → wrist pitch → magnet+camera ──
      HingeJoint {
        jointParameters HingeJointParameters {
          axis 0 0 1
          anchor 0 0 0.55
          dampingConstant 0.2
        }
        device [
          RotationalMotor { name "arm_base" maxVelocity 1.2 minPosition -3.1 maxPosition 3.1 maxTorque 110 }
          PositionSensor { name "arm_base_sensor" }
        ]
        endPoint Solid {
          translation 0 0 0.55
          name "arm_base_link"
          children [
            Shape { appearance USE ARM_DARK geometry Cylinder { radius 0.045 height 0.06 } }
            HingeJoint {
              jointParameters HingeJointParameters {
                axis 0 1 0
                anchor 0 0 0.06
                dampingConstant 0.2
              }
              device [
                RotationalMotor { name "arm_shoulder" maxVelocity 1.2 minPosition -1.6 maxPosition 1.6 maxTorque 110 }
                PositionSensor { name "arm_shoulder_sensor" }
              ]
              endPoint Solid {
                translation 0 0 0.06
                name "arm_upper_link"
                children [
                  Pose {
                    translation 0.15 0 0
                    rotation 0 1 0 1.5708
                    children [ Shape { appearance USE ARM_DARK geometry Cylinder { radius 0.022 height 0.30 } } ]
                  }
                  HingeJoint {
                    jointParameters HingeJointParameters {
                      axis 0 1 0
                      anchor 0.30 0 0
                      dampingConstant 0.2
                    }
                    device [
                      RotationalMotor { name "arm_elbow" maxVelocity 1.2 minPosition -2.8 maxPosition 0.1 maxTorque 110 }
                      PositionSensor { name "arm_elbow_sensor" }
                    ]
                    endPoint Solid {
                      translation 0.30 0 0
                      name "arm_fore_link"
                      children [
                        Pose {
                          translation 0.14 0 0
                          rotation 0 1 0 1.5708
                          children [ Shape { appearance USE ARM_DARK geometry Cylinder { radius 0.017 height 0.28 } } ]
                        }
                        HingeJoint {
                          jointParameters HingeJointParameters {
                            axis 0 1 0
                            anchor 0.28 0 0
                            dampingConstant 0.2
                          }
                          device [
                            RotationalMotor { name "arm_wrist" maxVelocity 1.6 minPosition -2.9 maxPosition 2.9 maxTorque 120 }
                            PositionSensor { name "arm_wrist_sensor" }
                          ]
                          endPoint Solid {
                            translation 0.28 0 0
                            name "arm_wrist_link"
                            children [
                              Pose {
                                translation 0.05 0 0
                                rotation 0 1 0 1.5708
                                children [ Shape { appearance USE ARM_DARK geometry Cylinder { radius 0.015 height 0.10 } } ]
                              }
                              # magnet plate
                              Pose {
                                translation 0.11 0 0
                                rotation 0 1 0 1.5708
                                children [
                                  Shape {
                                    appearance PBRAppearance { baseColor 0.85 0.2 0.1 roughness 0.3 metalness 0.7 emissiveColor 0.3 0.05 0.02 }
                                    geometry Cylinder { radius 0.032 height 0.02 }
                                  }
                                ]
                              }
                              # the "electromagnet": +z faces OUT along the wrist +x
                              Connector {
                                translation 0.12 0 0
                                rotation 0 1 0 1.5708
                                name "arm_magnet"
                                type "active"
                                isLocked FALSE
                                autoLock FALSE
                                distanceTolerance 0.05
                                axisTolerance 3.14
                                rotationTolerance 3.14
                                numberOfRotations 0
                                snap FALSE
                              }
                              # wrist cameras look along the SAME axis as the magnet (down when
                              # top-grasping): RGB + depth, offset a bit back so the plate
                              # doesn't fill the frame
                              Camera {
                                translation 0.06 0 0.045
                                rotation 0 1 0 1.5708
                                name "arm_camera"
                                width 160
                                height 120
                                fieldOfView 1.05
                              }
                              RangeFinder {
                                translation 0.06 0 -0.045
                                rotation 0 1 0 1.5708
                                name "arm_depth"
                                width 160
                                height 120
                                fieldOfView 1.05
                                minRange 0.05
                                maxRange 2.5
                              }
                              # visible RealSense-style RGBD module (cosmetic housing for the two
                              # sensors above): a wide dark bar with lens circles on the viewing face
                              # (viewing axis = wrist +x = straight down when top-grasping).
                              Pose {
                                translation 0.055 0 0
                                children [
                                  Shape {
                                    appearance PBRAppearance { baseColor 0.05 0.05 0.06 roughness 0.35 metalness 0.7 }
                                    geometry Box { size 0.022 0.10 0.028 }
                                  }
                                  # RGB + 2 IR + projector lenses on the +x (down) face
                                  Pose { translation 0.012 -0.032 0 rotation 0 1 0 1.5708 children [ Shape { appearance DEF LENS PBRAppearance { baseColor 0.02 0.03 0.08 roughness 0.1 metalness 0.3 } geometry Cylinder { radius 0.009 height 0.004 } } ] }
                                  Pose { translation 0.012 -0.010 0 rotation 0 1 0 1.5708 children [ Shape { appearance USE LENS geometry Cylinder { radius 0.009 height 0.004 } } ] }
                                  Pose { translation 0.012  0.012 0 rotation 0 1 0 1.5708 children [ Shape { appearance PBRAppearance { baseColor 0.15 0.08 0.02 roughness 0.1 } geometry Cylinder { radius 0.007 height 0.004 } } ] }
                                  Pose { translation 0.012  0.034 0 rotation 0 1 0 1.5708 children [ Shape { appearance USE LENS geometry Cylinder { radius 0.006 height 0.004 } } ] }
                                ]
                              }
                            ]

                          }
                        }
                      ]

                    }
                  }
                ]

              }
            }
          ]

        }
      }
    ]
    boundingObject Cylinder { radius 0.09 height 0.30 }
  }
}
