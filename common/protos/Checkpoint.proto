#VRML_SIM R2025a utf8
# Competition checkpoint / goal zone — a bright glowing FLOOR pad that sits ON the ground.
# Kept low on purpose: in the 3D lidar it reads as floor, NOT a vertical obstacle, so it neither
# clutters navigation nor hints the route (a simple height filter over lidar() drops it). The player
# still sees the glow via the camera. PHYSICS-FREE: the robot passes through freely; the referee
# (Supervisor) scores purely from the robot's XY vs `radius` and recolours it on score via `color`.
PROTO Checkpoint [
  field SFVec3f  translation  0 0 0
  field SFString name         "checkpoint"
  field SFFloat  radius       0.4
  field SFColor  color        0.15 0.5 1.0
]
{
  Solid {
    translation IS translation
    name IS name
    children [
      Shape {
        appearance PBRAppearance {
          baseColor IS color
          emissiveColor IS color
          emissiveIntensity 3.0
          transparency 0.05
          metalness 0
          roughness 0.4
        }
        geometry Cylinder { radius IS radius height 0.06 subdivision 40 }
      }
    ]
    # No boundingObject and no Physics → the robot cannot collide with it; the referee scores from XY.
  }
}
