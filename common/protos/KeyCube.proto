#VRML_SIM R2025a utf8
# The gate key: a glowing cube the arm carries to the receptacle. Passive Connector on top.
PROTO KeyCube [
  field SFVec3f  translation 0 0 0.1
  field SFColor  color       0.95 0.8 0.1
  field SFString name        "key_cube"
]
{
  Solid {
    translation IS translation
    name IS name
    children [
      Shape {
        appearance PBRAppearance {
          baseColor IS color
          emissiveColor IS color
          emissiveIntensity 0.6
          roughness 0.3
          metalness 0.4
        }
        geometry Box { size 0.08 0.08 0.08 }
      }
      Connector {
        translation 0 0 0.045
        name "key_port"
        type "passive"
        distanceTolerance 0.10
        axisTolerance 3.14
        rotationTolerance 3.14
        numberOfRotations 0
      }
    ]
    boundingObject Box { size 0.08 0.08 0.08 }
    physics Physics { density -1 mass 0.08 }
  }
}
